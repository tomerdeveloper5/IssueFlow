server:
  port: 8080

spring:
  application:
    name: issueflow
  datasource:
    url: jdbc:h2:mem:db;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driverClassName: org.h2.Driver
  sql:
    init:
      platform: mssql
  h2:
    console:
      enabled: true
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: ERROR
    org.springframework: ERROR
    org.hibernate: ERROR
    org.springframework.test.context: ERROR
    org.springframework.boot.test.context: ERROR

security:
  jwt:
    secret: ${JWT_TEST_SECRET:issueflow-test-only-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
